services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentic_ai_local
      POSTGRES_USER: agentic_ai
      POSTGRES_PASSWORD: agentic_ai_local_dev
    ports:
      - "5433:5432"
    volumes:
      - agentic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_ai -d agentic_ai_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agentic_postgres_data:
