name: Release Readiness

on:
  workflow_dispatch:

jobs:
  readiness:
    name: Manual release readiness checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full workspace checks
        run: pnpm run ci

      - name: Workspace dependency graph
        run: pnpm -r list --depth -1

      - name: Package metadata dry-run check
        run: pnpm -r --if-present pack --dry-run

      - name: Publishing disabled
        run: |
          echo "Release readiness passed metadata checks only."
          echo "This workflow never publishes packages, even when npm credentials exist."
